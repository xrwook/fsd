#################################### 필수 Variables ####################################
# ARTIFACTS_PATH: Gitlab Build 단계에서 저장될 artifacts 경로
# ROLE_ARN_[DEV/STG/PRD]: AssumeRole에 사용할 IAM Role ARN
# EXTERNAL_ID_[DEV/STG/PRD]: AssumeRole에 사용할 External ID (선택적)
# S3_BUCKET_[DEV/STG/PRD]: 배포할 S3 버킷명
# AWS_DEFAULT_REGION: AWS Region 명, S3 버킷의 Region
# AWS_ACCESS_KEY_ID: 초기 AWS 인증용 IAM User Access Key
# AWS_SECRET_ACCESS_KEY: 초기 AWS 인증용 IAM User Secret Key
########################################################################################

include:
  - local: '.gitlab/ci/common/common.yml'

stages:
  - initialize
  - build
  - deploy

####################################
# stage: initialize
####################################

initialize:
  stage: initialize
  image: 'node:24.16.0'
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(develop|stage|main)$/
      when: always
  script:
    - node .gitlab/scripts/workflow-initialize.cjs --output=workflow-variables.env --gitlab-base-url="$CI_SERVER_URL"
  artifacts:
    reports:
      dotenv: workflow-variables.env

####################################
# stage: build
####################################

build dev:
  extends: .build-common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
  script:
    - echo "🛠️ dev 빌드 시작"
    - pnpm run build:dev
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ dev 빌드 완료"

build stg emsp:
  extends: .build-common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: always
  script:
    - echo "🛠️ stg emsp 빌드 시작"
    - pnpm run build:stg:emsp
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ stg emsp 빌드 완료"

build stg cpos:
  extends: .build-common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: always
  script:
    - echo "🛠️ stg cpos 빌드 시작"
    - pnpm run build:stg:cpos
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ stg cpos 빌드 완료"

build prd emsp:
  extends: .build-common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
  script:
    - echo "🛠️ prod emsp 빌드 시작"
    - pnpm run build:prod:emsp
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ prod emsp 빌드 완료"

build prd cpos:
  extends: .build-common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
  script:
    - echo "🛠️ prod cpos 빌드 시작"
    - pnpm run build:prod:cpos
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ prod cpos 빌드 완료"

deploy dev:
  extends: .deploy-s3-assume-role
  environment:
    name: dev
  needs:
    - job: build dev
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_DEV
    EXTERNAL_ID: $AWS_EXTERNAL_ID
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success

deploy stg emsp:
  extends: .deploy-s3-assume-role
  environment:
    name: stg-emsp
  needs:
    - job: build stg emsp
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_STG
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: $S3_BUCKET_EMSP_STG
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: on_success

deploy stg cpos:
  extends: .deploy-s3-assume-role
  environment:
    name: stg-cpos
  needs:
    - job: build stg cpos
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_STG
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: $S3_BUCKET_CPOS_STG
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: on_success

deploy prd emsp:
  extends: .deploy-s3-assume-role
  environment:
    name: prd-emsp
  needs:
    - job: build prd emsp
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_PRD
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: $S3_BUCKET_EMSP_PRD
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

deploy prd cpos:
  extends: .deploy-s3-assume-role
  environment:
    name: prd-cpos
  needs:
    - job: build prd cpos
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_PRD
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: $S3_BUCKET_CPOS_PRD
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
