#################################### 필수 Variables ####################################
# ARTIFACTS_PATH: Gitlab Build 단계에서 저장될 artifacts 경로
# ROLE_ARN_[DEV/STG/PRD]: AssumeRole에 사용할 IAM Role ARN
# EXTERNAL_ID_[DEV/STG/PRD]: AssumeRole에 사용할 External ID (선택적)
# S3_BUCKET_DEV: DEV 배포 버킷명
# S3_BUCKET_EMSP_STG / S3_BUCKET_CPOS_STG: STG 대상별 배포 버킷명
# S3_BUCKET_EMSP_PRD / S3_BUCKET_CPOS_PRD: PROD 대상별 배포 버킷명
# AWS_DEFAULT_REGION: AWS Region 명, S3 버킷의 Region
# AWS_ACCESS_KEY_ID: 초기 AWS 인증용 IAM User Access Key
# AWS_SECRET_ACCESS_KEY: 초기 AWS 인증용 IAM User Secret Key
########################################################################################

include:
  - local: '.gitlab/ci/common/common.yml'

stages:
  - initialize
  - build
  - deploy

variables:
  ARTIFACTS_PATH: 'dist'

.build-common-before-script: &build-common-before-script
  - |
    if [[ "$CI_COMMIT_REF_NAME" =~ "main" ]]; then
      export MODE="prod"
    elif [[ "$CI_COMMIT_REF_NAME" =~ "stage" ]]; then
      export MODE="stg"
    elif [[ "$CI_COMMIT_REF_NAME" =~ "develop" ]]; then
      export MODE="dev"
    else
      export MODE="error"
    fi
    echo "ENV: $MODE"
  - corepack enable
  - >
    COREPACK_NPM_REGISTRY=https://nexus.auto-hmg.io/repository/npm-group
    corepack prepare pnpm@9.6.0 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --no-frozen-lockfile

####################################################################################
# stage: initialize
####################################################################################

initialize:
  stage: initialize
  image: 'node:24.16.0'
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(develop|stage|main)$/
      when: always
  script:
    - node .gitlab/scripts/workflow-initialize.cjs --output=workflow-variables.env --gitlab-base-url="$CI_SERVER_URL"
  artifacts:
    reports:
      dotenv: workflow-variables.env

####################################################################################
# stage: build
####################################################################################

build: &build-common
  stage: build
  image: node:24.16.0
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_TAG =~ /^hotfix.*/
      when: always
  interruptible: true
  before_script:
    - echo "🚀 빌드 준비 단계 시작..."
    - *build-common-before-script
    - echo "✅ 빌드 준비 단계 완료"
  script:
    - echo "🏗️ $MODE 빌드 시작"
    - pnpm run build:$MODE
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ 빌드 완료"
  artifacts:
    paths:
      - $ARTIFACTS_PATH
    expire_in: 1 hour
    when: on_success
    reports:
      dotenv: build_id.env

build stg emsp:
  <<: *build-common
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: always
  script:
    - echo "🏗️ stg emsp 빌드 시작"
    - pnpm run build:stg:emsp
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ 빌드 완료"

build stg cpos:
  <<: *build-common
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: always
  script:
    - echo "🏗️ stg cpos 빌드 시작"
    - pnpm run build:stg:cpos
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ 빌드 완료"

build prd emsp:
  <<: *build-common
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
  script:
    - echo "🏗️ prd emsp 빌드 시작"
    - pnpm run build:prod:emsp
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ 빌드 완료"

build prd cpos:
  <<: *build-common
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
  script:
    - echo "🏗️ prd cpos 빌드 시작"
    - pnpm run build:prod:cpos
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build_id.env
    - echo "✅ 빌드 완료"

####################################################################################
# AssumeRole 권한 부여 함수
####################################################################################

.assume-role-function: &assume-role-function
  - |
    echo "🔐 AssumeRole 인증 시작..."
    if [[ "$CI_COMMIT_REF_NAME" =~ "main" ]]; then
      ENV_SUFFIX="PRD"
    elif [[ "$CI_COMMIT_REF_NAME" =~ "stage" ]]; then
      ENV_SUFFIX="STG"
    else
      ENV_SUFFIX="DEV"
    fi
    ACCESS_KEY_VAR="AWS_ACCESS_KEY_ASSUME_${ENV_SUFFIX}"
    SECRET_KEY_VAR="AWS_SECRET_ACCESS_KEY_ASSUME_${ENV_SUFFIX}"
    export AWS_ACCESS_KEY_ID="${!ACCESS_KEY_VAR}"
    export AWS_SECRET_ACCESS_KEY="${!SECRET_KEY_VAR}"
    aws sts get-caller-identity || {
      echo "❌ AWS 기본 자격 증명 확인 실패"
      exit 1
    }

    ASSUME_OUTPUT=$(aws sts assume-role \
      --role-arn "$ROLE_ARN" \
      --role-session-name "gitlab-${CI_PIPELINE_ID}" \
      --external-id "$EXTERNAL_ID" \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)

    if [ $? -ne 0 ]; then
      echo "❌ AssumeRole 실행 실패"
      exit 1
    fi

    read AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< "$ASSUME_OUTPUT"

    export AWS_ACCESS_KEY_ID
    export AWS_SECRET_ACCESS_KEY
    export AWS_SESSION_TOKEN

    echo "✅ AssumeRole 인증 완료"

####################################################################################
# stage: deploy
####################################################################################

.deploy-s3-assume-role: &deploy-s3-assume-role
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: ['']
  needs:
    - job: build
      artifacts: true
  before_script:
    - *assume-role-function
    - echo "🚀 배포 준비 단계 시작..."
    - |
      if [[ "$CI_COMMIT_REF_NAME" =~ "main" ]]; then
        export ENV_PROFILE="PRD"
      elif [[ "$CI_COMMIT_REF_NAME" =~ "stage" ]]; then
        export ENV_PROFILE="STG"
      elif [[ "$CI_COMMIT_REF_NAME" =~ "develop" ]]; then
        export ENV_PROFILE="DEV"
      else
        export ENV_PROFILE="error"
      fi
    - echo "🌎 환경:$ENV_PROFILE"
    - |
      if [ -z "${S3_BUCKET:-}" ]; then
        S3_BUCKET="S3_BUCKET_${ENV_PROFILE}"
      fi
  script:
    - export
    - echo 'Deploying to S3:' ${!S3_BUCKET}

    # METADATAS 처리를 위한 JSON 변환 로직
    - |
      if [ -n "${METADATAS}" ]; then
        META_JSON="{"
        IFS=';' read -ra META_ARR <<< "${METADATAS}"
        for i in "${META_ARR[@]}"; do
          KEY=$(echo $i | cut -d':' -f1)
          VALUE=$(echo $i | cut -d':' -f2-)
          META_JSON="${META_JSON}\"${KEY}\":\"${VALUE}\","
        done
        META_JSON="${META_JSON%,}}"
      else
        META_JSON="{}"
      fi

    # INCLUDE_PATH_PATTERN, EXCLUDE_PATH_PATTERN 적용
    - |
      EXCLUDE_OPTS=""
      INCLUDE_OPTS=""
      if [ -n "${EXCLUDE_PATH_PATTERN}" ]; then
        EXCLUDE_OPTS="--exclude \"${EXCLUDE_PATH_PATTERN}\""
      fi
      if [ -n "${INCLUDE_PATH_PATTERN}" ]; then
        INCLUDE_OPTS="--include \"${INCLUDE_PATH_PATTERN}\""
      fi

    # 콘텐츠 인코딩, 타입, 디스포지션 옵션 처리
    - |
      CONTENT_ENCODING_OPT=""
      if [ -n "${CONTENT_ENCODING}" ]; then
        CONTENT_ENCODING_OPT="--content-encoding \"${CONTENT_ENCODING}\""
      fi

      CONTENT_TYPE_OPT=""
      if [ -n "${CONTENT_TYPE}" ]; then
        CONTENT_TYPE_OPT="--content-type \"${CONTENT_TYPE}\""
      fi

      CONTENT_DISPOSITION_OPT=""
      if [ -n "${CONTENT_DISPOSITION}" ]; then
        CONTENT_DISPOSITION_OPT="--content-disposition \"${CONTENT_DISPOSITION}\""
      fi

      # favicon, robots.txt 등 기타 파일 캐시 (CI 변수 CACHE_CONTROL로 오버라이드 가능, 기본값 24h)
      OTHER_CACHE_CONTROL="${CACHE_CONTROL:-public, max-age=86400}"

    # 1단계: hashed assets 업로드 (content hash 포함 → 1년 immutable 캐시)
    - |
      if [ ! -d "${ARTIFACTS_PATH}/assets" ]; then
        echo "❌ assets/ 디렉토리 없음 - 빌드 결과물 확인 필요"
        exit 1
      fi

      aws s3 cp ${ARTIFACTS_PATH}/assets/ s3://${!S3_BUCKET}/${TO_PATH#/}/assets/ \
        --recursive \
        --cache-control "public, max-age=31536000, immutable" \
        ${CONTENT_ENCODING_OPT} \
        --metadata "${META_JSON}"
      echo "✅ assets/ 업로드 완료 (immutable 캐시)"

    # 2단계: index.html 제외 나머지 파일 업로드
    # CMD 문자열 내 단따옴표: eval 실행 시 word splitting 방지 (${META_JSON}은 CMD 빌드 시 이미 치환됨)
    - |
      CMD="aws s3 cp ${ARTIFACTS_PATH} s3://${!S3_BUCKET}/${TO_PATH#/}/ \
        --recursive \
        --exclude 'assets/*' \
        --exclude 'index.html' \
        --exclude 'bundle-analyze.html' \
        ${EXCLUDE_OPTS} \
        ${INCLUDE_OPTS} \
        --cache-control '${OTHER_CACHE_CONTROL}' \
        ${CONTENT_ENCODING_OPT} \
        ${CONTENT_TYPE_OPT} \
        ${CONTENT_DISPOSITION_OPT} \
        --metadata '${META_JSON}'"
      echo "Running command: $CMD"
      eval $CMD
      echo "✅ 기타 파일 업로드 완료"

    # 3단계: index.html 마지막 업로드 (atomic swap, no-cache)
    - |
      aws s3 cp ${ARTIFACTS_PATH}/index.html s3://${!S3_BUCKET}/${TO_PATH#/}/index.html \
        --cache-control "no-cache, no-store, must-revalidate" \
        ${CONTENT_ENCODING_OPT} \
        --metadata "${META_JSON}"
      echo "✅ index.html 업로드 완료 (no-cache)"
  after_script:
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

deploy dev:
  <<: *deploy-s3-assume-role
  environment:
    name: dev
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_DEV
    EXTERNAL_ID: $AWS_EXTERNAL_ID
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success

deploy stg emsp:
  <<: *deploy-s3-assume-role
  environment:
    name: stg
  needs:
    - job: build stg emsp
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_STG
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: S3_BUCKET_EMSP_STG
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: on_success

deploy stg cpos:
  <<: *deploy-s3-assume-role
  environment:
    name: stg
  needs:
    - job: build stg cpos
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_STG
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: S3_BUCKET_CPOS_STG
  rules:
    - if: $CI_COMMIT_BRANCH == "stage"
      when: on_success

deploy prd emsp:
  <<: *deploy-s3-assume-role
  environment:
    name: prd
  needs:
    - job: build prd emsp
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_PRD
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: S3_BUCKET_EMSP_PRD
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

deploy prd cpos:
  <<: *deploy-s3-assume-role
  environment:
    name: prd
  needs:
    - job: build prd cpos
      artifacts: true
  variables:
    ROLE_ARN: $AWS_ROLE_ARN_PRD
    EXTERNAL_ID: $AWS_EXTERNAL_ID
    S3_BUCKET: S3_BUCKET_CPOS_PRD
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
